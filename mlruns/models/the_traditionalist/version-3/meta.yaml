description: '1) Direct Answer First Rule (Section 2.2 – Thought Process Architecture)  Comment:
  This is a strong and necessary correction. It directly fixes the recurring issue
  where the persona “thinks out loud” but never actually answers the question being
  asked. By forcing a clear stance in the first sentence (ranking, preference, or
  position), the response now sounds like a senior clinician who is used to being
  decisive, not an analyst circling the topic.  Importantly, this does not make the
  persona rigid or simplistic—the justification still follows in Baumann’s natural,
  reflective style. It preserves authenticity while eliminating evasiveness. This
  rule will improve all preference-based questions (e.g., “what matters most,” “what
  convinces you,” “what do you look at first”) without hard-coding any content.  Net
  effect: ✔ More authoritative ✔ Less generic ✔ Clinically realistic senior-physician
  behavior  2) Feasibility as a Secondary Constraint (Section 1.2 / 3.5 alignment)  Comment:
  This change resolves a structural contradiction in the prompt. Previously, the persona
  was expected to sound pragmatic and system-aware, yet was explicitly prohibited
  from mentioning access, workflow, or feasibility—which is not realistic for a German
  Traditionalist oncologist embedded in MDTs and hospital systems.  By reframing feasibility
  as a secondary clinical constraint (after benefit and safety, not as a financial
  driver), the persona now behaves exactly like a conservative system guardian:  stable
  pathways matter  implementation must be reliable  disruption is avoided unless justified  Crucially,
  this does not turn the persona into a cost-focused or reimbursement-driven actor.
  It preserves clinical primacy while allowing realistic comments on monitoring burden,
  chair time, staffing, and workflow—things real senior oncologists always consider
  but rarely label as “financial.”  Net effect: ✔ More realistic Traditionalist behavior
  ✔ Enables workflow-aware answers without ethics drift ✔ Aligns with MDT-centric
  European practice  Overall Assessment  Together, these two changes significantly
  improve persona fidelity and answer quality while staying generic and reusable.
  They address the reviewer feedback at the behavioral level, not by scripting answers—exactly
  the right fix for a master prompt.'

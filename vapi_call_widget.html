<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAPI Call Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            color: #fafafa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }
        
        .call-widget {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 300px;
        }
        
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a9eff 0%, #3a8eef 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-bottom: 1rem;
            border: 3px solid #4a9eff;
            box-shadow: 0 0 30px rgba(74, 158, 255, 0.4);
            transition: all 0.3s ease;
        }
        
        .avatar.speaking {
            animation: speaking-pulse 0.5s ease-in-out infinite;
            border-color: #50c878;
            box-shadow: 0 0 40px rgba(80, 200, 120, 0.7);
        }
        
        .avatar.listening {
            animation: listening-pulse 1s ease-in-out infinite;
            border-color: #ffa500;
            box-shadow: 0 0 40px rgba(255, 165, 0, 0.5);
        }
        
        @keyframes speaking-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes listening-pulse {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 165, 0, 0.3); }
            50% { box-shadow: 0 0 50px rgba(255, 165, 0, 0.7); }
        }
        
        .bot-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #4a9eff;
            margin-bottom: 0.3rem;
        }
        
        .status {
            font-size: 0.85rem;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            margin-bottom: 1rem;
        }
        
        .status-idle { background: rgba(136, 136, 136, 0.3); color: #aaa; }
        .status-connecting { background: rgba(255, 165, 0, 0.3); color: #ffa500; }
        .status-active { background: rgba(80, 200, 120, 0.3); color: #50c878; }
        .status-ended { background: rgba(255, 107, 107, 0.3); color: #ff6b6b; }
        
        .call-timer {
            font-size: 1.8rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            color: #fafafa;
            margin-bottom: 1rem;
            display: none;
        }
        
        .call-timer.visible { display: block; }
        
        .volume-indicator {
            display: none;
            justify-content: center;
            gap: 3px;
            height: 30px;
            align-items: flex-end;
            margin-bottom: 1rem;
        }
        
        .volume-indicator.visible { display: flex; }
        
        .volume-bar {
            width: 4px;
            background: linear-gradient(to top, #4a9eff, #50c878);
            border-radius: 2px;
            transition: height 0.1s ease;
        }
        
        .controls {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }
        
        .btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.4rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn:hover { transform: scale(1.1); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .btn-call {
            background: linear-gradient(135deg, #50c878 0%, #3cb371 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(80, 200, 120, 0.4);
        }
        
        .btn-hangup {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff4757 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.4);
            display: none;
        }
        
        .btn-mute {
            background: rgba(255, 255, 255, 0.1);
            color: #fafafa;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn-mute.muted {
            background: rgba(255, 107, 107, 0.3);
            border-color: #ff6b6b;
            color: #ff6b6b;
        }
        
        .error-message {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            border-radius: 8px;
            padding: 0.6rem 1rem;
            color: #ff6b6b;
            text-align: center;
            font-size: 0.8rem;
            display: none;
            max-width: 250px;
        }
        
        .error-message.visible { display: block; }
    </style>
</head>
<body>
    <div class="call-widget">
        <div class="avatar" id="avatar">🤖</div>
        <div class="bot-name">Voice Assistant</div>
        <div class="status status-idle" id="status">● Ready to Call</div>
        
        <div class="call-timer" id="timer">00:00</div>
        
        <div class="volume-indicator" id="volume">
            <div class="volume-bar" style="height: 6px;"></div>
            <div class="volume-bar" style="height: 12px;"></div>
            <div class="volume-bar" style="height: 20px;"></div>
            <div class="volume-bar" style="height: 12px;"></div>
            <div class="volume-bar" style="height: 6px;"></div>
        </div>
        
        <div class="controls">
            <button class="btn btn-mute" id="muteBtn" disabled onclick="toggleMute()">🎤</button>
            <button class="btn btn-call" id="callBtn" onclick="startCall()">📞</button>
            <button class="btn btn-hangup" id="hangupBtn" onclick="endCall()">📴</button>
        </div>
        
        <div class="error-message" id="error"></div>
    </div>

    <script type="module">
        // VAPI Configuration - Read from URL parameters for dynamic bot selection
        const urlParams = new URLSearchParams(window.location.search);
        const PUBLIC_KEY = urlParams.get('publicKey') || '96e66c5a-94a1-4071-8b1e-a9b5e4592c25';
        const ASSISTANT_ID = urlParams.get('assistantId') || 'b0bf28dc-3eb4-43e3-94f8-58ff2d4cf470';
        const BOT_NAME = urlParams.get('botName') || 'Voice Assistant';
        const BOT_EMOJI = urlParams.get('emoji') || '🤖';
        
        // Update UI with bot info
        document.querySelector('.bot-name').textContent = BOT_NAME;
        document.getElementById('avatar').textContent = BOT_EMOJI;
        
        let vapi = null;
        let callActive = false;
        let isMuted = false;
        let callStartTime = null;
        let timerInterval = null;
        
        const avatar = document.getElementById('avatar');
        const status = document.getElementById('status');
        const timer = document.getElementById('timer');
        const volume = document.getElementById('volume');
        const callBtn = document.getElementById('callBtn');
        const hangupBtn = document.getElementById('hangupBtn');
        const muteBtn = document.getElementById('muteBtn');
        const errorDiv = document.getElementById('error');
        
        // Store transcript in localStorage (triggers storage event in other iframes)
        let transcriptMessages = [];
        
        function saveTranscript(role, content, isFinal) {
            if (isFinal && content) {
                transcriptMessages.push({
                    role: role,
                    content: content,
                    timestamp: new Date().toISOString()
                });
                // Write to localStorage - this triggers 'storage' event in transcript iframe
                localStorage.setItem('vapi_transcript', JSON.stringify(transcriptMessages));
            }
        }
        
        function clearStoredTranscript() {
            transcriptMessages = [];
            localStorage.setItem('vapi_transcript', JSON.stringify([]));
        }
        
        // Import VAPI SDK
        try {
            const VapiModule = await import('https://cdn.jsdelivr.net/npm/@vapi-ai/web@latest/+esm');
            const Vapi = VapiModule.default.default;
            
            vapi = new Vapi(PUBLIC_KEY);
            console.log('VAPI initialized');
            
            vapi.on('call-start', () => {
                callActive = true;
                updateUI('active');
                startTimer();
                hideError();
            });
            
            vapi.on('call-end', () => {
                callActive = false;
                updateUI('ended');
                stopTimer();
            });
            
            vapi.on('speech-start', () => {
                avatar.classList.add('speaking');
                avatar.classList.remove('listening');
            });
            
            vapi.on('speech-end', () => {
                avatar.classList.remove('speaking');
            });
            
            vapi.on('message', (message) => {
                if (message.type === 'transcript') {
                    const isFinal = message.transcriptType === 'final';
                    saveTranscript(message.role, message.transcript, isFinal);
                }
            });
            
            vapi.on('volume-level', (level) => {
                updateVolumeIndicator(level);
                if (level > 0.1) {
                    avatar.classList.add('listening');
                    avatar.classList.remove('speaking');
                }
            });
            
            vapi.on('error', (error) => {
                showError(error.message || 'An error occurred');
                callActive = false;
                updateUI('idle');
                stopTimer();
            });
            
        } catch (err) {
            showError('Failed to load VAPI SDK');
        }
        
        window.startCall = async function() {
            if (!vapi) {
                showError('VAPI not initialized');
                return;
            }
            
            try {
                updateUI('connecting');
                hideError();
                clearStoredTranscript();  // Clear transcript for new call
                
                await navigator.mediaDevices.getUserMedia({ audio: true });
                await vapi.start(ASSISTANT_ID);
                
            } catch (error) {
                showError(error.message || 'Failed to start call');
                updateUI('idle');
            }
        };
        
        window.endCall = function() {
            if (vapi && callActive) {
                vapi.stop();
            }
        };
        
        window.toggleMute = function() {
            if (!vapi || !callActive) return;
            
            isMuted = !isMuted;
            vapi.setMuted(isMuted);
            muteBtn.textContent = isMuted ? '🔇' : '🎤';
            muteBtn.classList.toggle('muted', isMuted);
        };
        
        function updateUI(state) {
            status.className = 'status status-' + state;
            
            switch(state) {
                case 'idle':
                    status.textContent = '● Ready to Call';
                    callBtn.style.display = 'flex';
                    hangupBtn.style.display = 'none';
                    muteBtn.disabled = true;
                    timer.classList.remove('visible');
                    volume.classList.remove('visible');
                    avatar.classList.remove('speaking', 'listening');
                    break;
                case 'connecting':
                    status.textContent = '● Connecting...';
                    callBtn.style.display = 'none';
                    hangupBtn.style.display = 'flex';
                    muteBtn.disabled = true;
                    break;
                case 'active':
                    status.textContent = '● Call Active';
                    callBtn.style.display = 'none';
                    hangupBtn.style.display = 'flex';
                    muteBtn.disabled = false;
                    timer.classList.add('visible');
                    volume.classList.add('visible');
                    break;
                case 'ended':
                    status.textContent = '● Call Ended';
                    callBtn.style.display = 'flex';
                    hangupBtn.style.display = 'none';
                    muteBtn.disabled = true;
                    timer.classList.add('visible');
                    volume.classList.remove('visible');
                    avatar.classList.remove('speaking', 'listening');
                    break;
            }
        }
        
        function updateVolumeIndicator(level) {
            const bars = volume.querySelectorAll('.volume-bar');
            const heights = [6, 12, 20, 12, 6];
            bars.forEach((bar, i) => {
                bar.style.height = (heights[i] + level * 25) + 'px';
            });
        }
        
        function startTimer() {
            callStartTime = new Date();
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((new Date() - callStartTime) / 1000);
                const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const seconds = (elapsed % 60).toString().padStart(2, '0');
                timer.textContent = minutes + ':' + seconds;
            }, 1000);
        }
        
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }
        
        function showError(message) {
            errorDiv.textContent = '⚠️ ' + message;
            errorDiv.classList.add('visible');
        }
        
        function hideError() {
            errorDiv.classList.remove('visible');
        }
    </script>
</body>
</html>

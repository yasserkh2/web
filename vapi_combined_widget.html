<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Call with Transcript</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            color: #fafafa;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            height: 100%;
            gap: 15px;
            padding: 10px;
        }
        
        /* Call Widget Section */
        .call-section {
            flex: 0 0 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a9eff 0%, #3a8eef 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 0.8rem;
            border: 3px solid #4a9eff;
            box-shadow: 0 0 25px rgba(74, 158, 255, 0.4);
            transition: all 0.3s ease;
        }
        
        .avatar.speaking {
            animation: speaking-pulse 0.5s ease-in-out infinite;
            border-color: #50c878;
            box-shadow: 0 0 35px rgba(80, 200, 120, 0.7);
        }
        
        .avatar.listening {
            animation: listening-pulse 1s ease-in-out infinite;
            border-color: #ffa500;
            box-shadow: 0 0 35px rgba(255, 165, 0, 0.5);
        }
        
        @keyframes speaking-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes listening-pulse {
            0%, 100% { box-shadow: 0 0 25px rgba(255, 165, 0, 0.3); }
            50% { box-shadow: 0 0 45px rgba(255, 165, 0, 0.7); }
        }
        
        .bot-name {
            font-size: 1rem;
            font-weight: bold;
            color: #4a9eff;
            margin-bottom: 0.2rem;
        }
        
        .status {
            font-size: 0.75rem;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            margin-bottom: 0.8rem;
        }
        
        .status-idle { background: rgba(136, 136, 136, 0.3); color: #aaa; }
        .status-connecting { background: rgba(255, 165, 0, 0.3); color: #ffa500; }
        .status-active { background: rgba(80, 200, 120, 0.3); color: #50c878; }
        .status-ended { background: rgba(255, 107, 107, 0.3); color: #ff6b6b; }
        
        .call-timer {
            font-size: 1.4rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            color: #fafafa;
            margin-bottom: 0.8rem;
            display: none;
        }
        
        .call-timer.visible { display: block; }
        
        .controls {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 0.8rem;
        }
        
        .btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn:hover { transform: scale(1.1); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .btn-call {
            background: linear-gradient(135deg, #50c878 0%, #3cb371 100%);
            color: white;
            box-shadow: 0 3px 15px rgba(80, 200, 120, 0.4);
        }
        
        .btn-hangup {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff4757 100%);
            color: white;
            box-shadow: 0 3px 15px rgba(255, 107, 107, 0.4);
            display: none;
        }
        
        .btn-mute {
            background: rgba(255, 255, 255, 0.1);
            color: #fafafa;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn-mute.muted {
            background: rgba(255, 107, 107, 0.3);
            border-color: #ff6b6b;
            color: #ff6b6b;
        }
        
        .error-message {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            border-radius: 6px;
            padding: 0.4rem 0.8rem;
            color: #ff6b6b;
            text-align: center;
            font-size: 0.7rem;
            display: none;
            max-width: 180px;
        }
        
        .error-message.visible { display: block; }
        
        /* Transcript Section */
        .transcript-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            border-left: 1px solid rgba(255,255,255,0.1);
            padding-left: 15px;
        }
        
        .transcript-header {
            font-size: 0.9rem;
            font-weight: bold;
            color: #888;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .transcript-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
        }
        
        .transcript-container::-webkit-scrollbar { width: 5px; }
        .transcript-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
        .transcript-container::-webkit-scrollbar-thumb { background: #4a9eff; border-radius: 3px; }
        
        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-user {
            background: rgba(74, 158, 255, 0.15);
            border-left: 3px solid #4a9eff;
            margin-left: 10px;
        }
        
        .message-assistant {
            background: rgba(80, 200, 120, 0.15);
            border-left: 3px solid #50c878;
            margin-right: 10px;
        }
        
        .role {
            font-weight: bold;
            font-size: 0.7rem;
            margin-bottom: 4px;
        }
        
        .role-user { color: #4a9eff; }
        .role-assistant { color: #50c878; }
        
        .content {
            color: #e0e0e0;
            line-height: 1.4;
            font-size: 0.85rem;
        }
        
        .empty {
            text-align: center;
            color: #555;
            padding: 40px 15px;
        }
        
        .empty-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .empty-text {
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Call Widget -->
        <div class="call-section">
            <div class="avatar" id="avatar">🤖</div>
            <div class="bot-name">Voice Assistant</div>
            <div class="status status-idle" id="status">● Ready</div>
            <div class="call-timer" id="timer">00:00</div>
            <div class="controls">
                <button class="btn btn-mute" id="muteBtn" disabled onclick="toggleMute()">🎤</button>
                <button class="btn btn-call" id="callBtn" onclick="startCall()">📞</button>
                <button class="btn btn-hangup" id="hangupBtn" onclick="endCall()">📴</button>
            </div>
            <div class="error-message" id="error"></div>
        </div>
        
        <!-- Transcript -->
        <div class="transcript-section">
            <div class="transcript-header">📝 Live Transcript</div>
            <div class="transcript-container" id="transcript">
                <div class="empty">
                    <div class="empty-icon">💬</div>
                    <div class="empty-text">Start a call to see the transcript</div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // VAPI Configuration - Read from URL parameters for dynamic bot selection
        const urlParams = new URLSearchParams(window.location.search);
        const PUBLIC_KEY = urlParams.get('publicKey') || '96e66c5a-94a1-4071-8b1e-a9b5e4592c25';
        const ASSISTANT_ID = urlParams.get('assistantId') || 'b0bf28dc-3eb4-43e3-94f8-58ff2d4cf470';
        const BOT_NAME = urlParams.get('botName') || 'Voice Assistant';
        const BOT_EMOJI = urlParams.get('emoji') || '🤖';
        
        // Update UI with bot info
        document.querySelector('.bot-name').textContent = BOT_NAME;
        document.getElementById('avatar').textContent = BOT_EMOJI;
        
        let vapi = null;
        let callActive = false;
        let isMuted = false;
        let callStartTime = null;
        let timerInterval = null;
        
        // DOM Elements
        const avatar = document.getElementById('avatar');
        const status = document.getElementById('status');
        const timer = document.getElementById('timer');
        const callBtn = document.getElementById('callBtn');
        const hangupBtn = document.getElementById('hangupBtn');
        const muteBtn = document.getElementById('muteBtn');
        const errorDiv = document.getElementById('error');
        const transcriptContainer = document.getElementById('transcript');
        
        // Transcript rendering
        function addMessage(role, content) {
            // Clear empty state on first message
            const emptyState = transcriptContainer.querySelector('.empty');
            if (emptyState) {
                transcriptContainer.innerHTML = '';
            }
            
            const roleClass = role === 'user' ? 'user' : 'assistant';
            const roleLabel = role === 'user' ? '👤 You' : '🤖 Assistant';
            
            const div = document.createElement('div');
            div.className = `message message-${roleClass}`;
            div.innerHTML = `
                <div class="role role-${roleClass}">${roleLabel}</div>
                <div class="content">${content}</div>
            `;
            transcriptContainer.appendChild(div);
            transcriptContainer.scrollTop = transcriptContainer.scrollHeight;
        }
        
        function clearTranscript() {
            transcriptContainer.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">💬</div>
                    <div class="empty-text">Start a call to see the transcript</div>
                </div>
            `;
        }
        
        // Import VAPI SDK
        try {
            const VapiModule = await import('https://cdn.jsdelivr.net/npm/@vapi-ai/web@latest/+esm');
            const Vapi = VapiModule.default.default;
            
            vapi = new Vapi(PUBLIC_KEY);
            console.log('VAPI initialized');
            
            vapi.on('call-start', () => {
                callActive = true;
                updateUI('active');
                startTimer();
                hideError();
            });
            
            vapi.on('call-end', () => {
                callActive = false;
                updateUI('ended');
                stopTimer();
            });
            
            vapi.on('speech-start', () => {
                avatar.classList.add('speaking');
                avatar.classList.remove('listening');
            });
            
            vapi.on('speech-end', () => {
                avatar.classList.remove('speaking');
            });
            
            // Capture transcript messages and display them directly
            vapi.on('message', (message) => {
                if (message.type === 'transcript' && message.transcriptType === 'final' && message.transcript) {
                    addMessage(message.role, message.transcript);
                }
            });
            
            vapi.on('volume-level', (level) => {
                if (level > 0.1) {
                    avatar.classList.add('listening');
                    avatar.classList.remove('speaking');
                }
            });
            
            vapi.on('error', (error) => {
                showError(error.message || 'An error occurred');
                callActive = false;
                updateUI('idle');
                stopTimer();
            });
            
        } catch (err) {
            showError('Failed to load VAPI SDK');
        }
        
        window.startCall = async function() {
            if (!vapi) {
                showError('VAPI not initialized');
                return;
            }
            
            try {
                updateUI('connecting');
                hideError();
                clearTranscript();
                
                await navigator.mediaDevices.getUserMedia({ audio: true });
                await vapi.start(ASSISTANT_ID);
                
            } catch (error) {
                showError(error.message || 'Failed to start call');
                updateUI('idle');
            }
        };
        
        window.endCall = function() {
            if (vapi && callActive) {
                vapi.stop();
            }
        };
        
        window.toggleMute = function() {
            if (!vapi || !callActive) return;
            
            isMuted = !isMuted;
            vapi.setMuted(isMuted);
            muteBtn.textContent = isMuted ? '🔇' : '🎤';
            muteBtn.classList.toggle('muted', isMuted);
        };
        
        function updateUI(state) {
            status.className = 'status status-' + state;
            
            switch(state) {
                case 'idle':
                    status.textContent = '● Ready';
                    callBtn.style.display = 'flex';
                    hangupBtn.style.display = 'none';
                    muteBtn.disabled = true;
                    timer.classList.remove('visible');
                    avatar.classList.remove('speaking', 'listening');
                    break;
                case 'connecting':
                    status.textContent = '● Connecting...';
                    callBtn.style.display = 'none';
                    hangupBtn.style.display = 'flex';
                    muteBtn.disabled = true;
                    break;
                case 'active':
                    status.textContent = '● Active';
                    callBtn.style.display = 'none';
                    hangupBtn.style.display = 'flex';
                    muteBtn.disabled = false;
                    timer.classList.add('visible');
                    break;
                case 'ended':
                    status.textContent = '● Ended';
                    callBtn.style.display = 'flex';
                    hangupBtn.style.display = 'none';
                    muteBtn.disabled = true;
                    timer.classList.add('visible');
                    avatar.classList.remove('speaking', 'listening');
                    break;
            }
        }
        
        function startTimer() {
            callStartTime = new Date();
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((new Date() - callStartTime) / 1000);
                const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const seconds = (elapsed % 60).toString().padStart(2, '0');
                timer.textContent = minutes + ':' + seconds;
            }, 1000);
        }
        
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }
        
        function showError(message) {
            errorDiv.textContent = '⚠️ ' + message;
            errorDiv.classList.add('visible');
        }
        
        function hideError() {
            errorDiv.classList.remove('visible');
        }
    </script>
</body>
</html>

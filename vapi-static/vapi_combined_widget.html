<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Call with Transcript</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            color: #fafafa;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            height: 100%;
            gap: 15px;
            padding: 10px;
        }
        
        /* Call Widget Section */
        .call-section {
            flex: 0 0 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a9eff 0%, #3a8eef 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 0.8rem;
            border: 3px solid #4a9eff;
            box-shadow: 0 0 25px rgba(74, 158, 255, 0.4);
            transition: all 0.3s ease;
        }
        
        .avatar.speaking {
            animation: speaking-pulse 0.5s ease-in-out infinite;
            border-color: #50c878;
            box-shadow: 0 0 35px rgba(80, 200, 120, 0.7);
        }
        
        .avatar.listening {
            animation: listening-pulse 1s ease-in-out infinite;
            border-color: #ffa500;
            box-shadow: 0 0 35px rgba(255, 165, 0, 0.5);
        }
        
        @keyframes speaking-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes listening-pulse {
            0%, 100% { box-shadow: 0 0 25px rgba(255, 165, 0, 0.3); }
            50% { box-shadow: 0 0 45px rgba(255, 165, 0, 0.7); }
        }
        
        .bot-name {
            font-size: 1rem;
            font-weight: bold;
            color: #4a9eff;
            margin-bottom: 0.2rem;
        }
        
        .status {
            font-size: 0.75rem;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            margin-bottom: 0.8rem;
        }
        
        .status-idle { background: rgba(136, 136, 136, 0.3); color: #aaa; }
        .status-connecting { background: rgba(255, 165, 0, 0.3); color: #ffa500; }
        .status-active { background: rgba(80, 200, 120, 0.3); color: #50c878; }
        .status-ended { background: rgba(255, 107, 107, 0.3); color: #ff6b6b; }
        
        .call-timer {
            font-size: 1.4rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            color: #fafafa;
            margin-bottom: 0.8rem;
            display: none;
        }
        
        .call-timer.visible { display: block; }
        
        .controls {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 0.8rem;
        }
        
        .btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn:hover { transform: scale(1.1); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .btn-call {
            background: linear-gradient(135deg, #50c878 0%, #3cb371 100%);
            color: white;
            box-shadow: 0 3px 15px rgba(80, 200, 120, 0.4);
        }
        
        .btn-hangup {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff4757 100%);
            color: white;
            box-shadow: 0 3px 15px rgba(255, 107, 107, 0.4);
            display: none;
        }
        
        .btn-mute {
            background: rgba(255, 255, 255, 0.1);
            color: #fafafa;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn-mute.muted {
            background: rgba(255, 107, 107, 0.3);
            border-color: #ff6b6b;
            color: #ff6b6b;
        }
        
        .error-message {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            border-radius: 6px;
            padding: 0.4rem 0.8rem;
            color: #ff6b6b;
            text-align: center;
            font-size: 0.7rem;
            display: none;
            max-width: 180px;
        }
        
        .error-message.visible { display: block; }
        
        /* Debug Panel */
        .debug-toggle {
            position: fixed;
            top: 5px;
            right: 5px;
            background: #4a9eff;
            color: #000;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
            font-size: 12px;
            z-index: 999;
        }
        
        .debug-panel {
            position: fixed;
            top: 35px;
            right: 5px;
            width: 320px;
            max-height: 250px;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #4a9eff;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            z-index: 1000;
            display: none;
        }
        
        .debug-panel.visible { display: block; }
        
        .debug-header {
            display: flex;
            justify-content: space-between;
            padding: 5px 8px;
            background: #4a9eff;
            color: #000;
            font-weight: bold;
            border-radius: 7px 7px 0 0;
        }
        
        .debug-header button {
            background: none;
            border: none;
            color: #000;
            cursor: pointer;
            font-size: 10px;
            padding: 0 3px;
        }
        
        .debug-logs {
            padding: 5px;
            max-height: 210px;
            overflow-y: auto;
            color: #0f0;
        }
        
        .log-entry { margin-bottom: 4px; padding: 2px; border-bottom: 1px solid rgba(255,255,255,0.1); word-break: break-word; }
        .log-entry.error { color: #ff6b6b; }
        .log-entry.warn { color: #ffa500; }
        .log-entry.info { color: #4a9eff; }
        .log-time { color: #888; margin-right: 5px; }
        
        /* Transcript Section */
        .transcript-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            border-left: 1px solid rgba(255,255,255,0.1);
            padding-left: 15px;
        }
        
        .transcript-header {
            font-size: 0.9rem;
            font-weight: bold;
            color: #888;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .transcript-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
        }
        
        .transcript-container::-webkit-scrollbar { width: 5px; }
        .transcript-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
        .transcript-container::-webkit-scrollbar-thumb { background: #4a9eff; border-radius: 3px; }
        
        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-user {
            background: rgba(74, 158, 255, 0.15);
            border-left: 3px solid #4a9eff;
            margin-left: 10px;
        }
        
        .message-assistant {
            background: rgba(80, 200, 120, 0.15);
            border-left: 3px solid #50c878;
            margin-right: 10px;
        }
        
        .role {
            font-weight: bold;
            font-size: 0.7rem;
            margin-bottom: 4px;
        }
        
        .role-user { color: #4a9eff; }
        .role-assistant { color: #50c878; }
        
        .content {
            color: #e0e0e0;
            line-height: 1.4;
            font-size: 0.85rem;
        }
        
        .empty {
            text-align: center;
            color: #555;
            padding: 40px 15px;
        }
        
        .empty-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .empty-text {
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <!-- Debug Toggle -->
    <button class="debug-toggle" onclick="toggleDebugPanel()" title="Toggle Debug Logs">🔧</button>
    
    <!-- Debug Panel -->
    <div class="debug-panel" id="debugPanel">
        <div class="debug-header">
            <span>🔍 Debug Logs</span>
            <div>
                <button onclick="clearDebugLogs()">🗑️</button>
                <button onclick="copyDebugLogs()">📋</button>
                <button onclick="toggleDebugPanel()">✕</button>
            </div>
        </div>
        <div class="debug-logs" id="debugLogs"></div>
    </div>
    
    <div class="container">
        <!-- Call Widget -->
        <div class="call-section">
            <div class="avatar" id="avatar">🤖</div>
            <div class="bot-name">Voice Assistant</div>
            <div class="status status-idle" id="status">● Ready</div>
            <div class="call-timer" id="timer">00:00</div>
            <div class="controls">
                <button class="btn btn-mute" id="muteBtn" disabled onclick="toggleMute()">🎤</button>
                <button class="btn btn-call" id="callBtn" onclick="startCall()">📞</button>
                <button class="btn btn-hangup" id="hangupBtn" onclick="endCall()">📴</button>
            </div>
            <div class="error-message" id="error"></div>
        </div>
        
        <!-- Transcript -->
        <div class="transcript-section">
            <div class="transcript-header">📝 Live Transcript</div>
            <div class="transcript-container" id="transcript">
                <div class="empty">
                    <div class="empty-icon">💬</div>
                    <div class="empty-text">Start a call to see the transcript</div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // VAPI Configuration
        const PUBLIC_KEY = '96e66c5a-94a1-4071-8b1e-a9b5e4592c25';
        const ASSISTANT_ID = 'b0bf28dc-3eb4-43e3-94f8-58ff2d4cf470';
        
        let vapi = null;
        let callActive = false;
        let isMuted = false;
        let callStartTime = null;
        let timerInterval = null;
        let debugLogs = [];
        
        // DOM Elements
        const avatar = document.getElementById('avatar');
        const status = document.getElementById('status');
        const timer = document.getElementById('timer');
        const callBtn = document.getElementById('callBtn');
        const hangupBtn = document.getElementById('hangupBtn');
        const muteBtn = document.getElementById('muteBtn');
        const errorDiv = document.getElementById('error');
        const transcriptContainer = document.getElementById('transcript');
        
        // Debug Logging Functions
        function debugLog(message, type = 'info', data = null) {
            const timestamp = new Date().toISOString();
            debugLogs.push({ timestamp, type, message, data });
            const consoleMethod = type === 'error' ? 'error' : type === 'warn' ? 'warn' : 'log';
            console[consoleMethod](`[${timestamp}] ${message}`, data || '');
            updateDebugPanel();
        }
        
        function updateDebugPanel() {
            const logsContainer = document.getElementById('debugLogs');
            if (!logsContainer) return;
            logsContainer.innerHTML = debugLogs.map(log => {
                const time = log.timestamp.split('T')[1].split('.')[0];
                let dataStr = '';
                if (log.data) {
                    try { dataStr = '<br>' + JSON.stringify(log.data, null, 2).replace(/\n/g, '<br>').replace(/ /g, '&nbsp;'); }
                    catch (e) { dataStr = '<br>' + String(log.data); }
                }
                return `<div class="log-entry ${log.type}"><span class="log-time">${time}</span>${log.message}${dataStr}</div>`;
            }).join('');
            logsContainer.scrollTop = logsContainer.scrollHeight;
        }
        
        window.toggleDebugPanel = function() { document.getElementById('debugPanel').classList.toggle('visible'); };
        window.clearDebugLogs = function() { debugLogs = []; updateDebugPanel(); };
        window.copyDebugLogs = function() {
            const logText = debugLogs.map(log => `[${log.timestamp}] [${log.type.toUpperCase()}] ${log.message}${log.data ? '\n' + JSON.stringify(log.data, null, 2) : ''}`).join('\n\n');
            navigator.clipboard.writeText(logText).then(() => alert('Logs copied to clipboard!'));
        };
        
        function extractErrorDetails(error) {
            const details = { message: error?.message || 'Unknown error', name: error?.name || 'Error', code: error?.code || null, status: error?.status || error?.statusCode || null };
            if (error && typeof error === 'object') {
                Object.keys(error).forEach(key => { if (!details[key] && error[key] !== undefined) details[key] = error[key]; });
            }
            if (typeof error === 'string') details.message = error;
            return details;
        }
        
        // Transcript rendering
        function addMessage(role, content) {
            // Clear empty state on first message
            const emptyState = transcriptContainer.querySelector('.empty');
            if (emptyState) {
                transcriptContainer.innerHTML = '';
            }
            
            const roleClass = role === 'user' ? 'user' : 'assistant';
            const roleLabel = role === 'user' ? '👤 You' : '🤖 Assistant';
            
            const div = document.createElement('div');
            div.className = `message message-${roleClass}`;
            div.innerHTML = `
                <div class="role role-${roleClass}">${roleLabel}</div>
                <div class="content">${content}</div>
            `;
            transcriptContainer.appendChild(div);
            transcriptContainer.scrollTop = transcriptContainer.scrollHeight;
        }
        
        function clearTranscript() {
            transcriptContainer.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">💬</div>
                    <div class="empty-text">Start a call to see the transcript</div>
                </div>
            `;
        }
        
        // Import VAPI SDK
        try {
            debugLog('Loading VAPI SDK...', 'info');
            const VapiModule = await import('https://cdn.jsdelivr.net/npm/@vapi-ai/web@latest/+esm');
            const Vapi = VapiModule.default.default;
            
            vapi = new Vapi(PUBLIC_KEY);
            debugLog('VAPI initialized', 'info');
            
            vapi.on('call-start', () => {
                debugLog('Call started', 'info');
                callActive = true;
                updateUI('active');
                startTimer();
                hideError();
            });
            
            vapi.on('call-end', () => {
                debugLog('Call ended', 'info');
                callActive = false;
                updateUI('ended');
                stopTimer();
            });
            
            vapi.on('speech-start', () => {
                debugLog('Assistant speaking', 'info');
                avatar.classList.add('speaking');
                avatar.classList.remove('listening');
            });
            
            vapi.on('speech-end', () => {
                avatar.classList.remove('speaking');
            });
            
            // Capture transcript messages and display them directly
            vapi.on('message', (message) => {
                if (message.type === 'transcript' && message.transcriptType === 'final' && message.transcript) {
                    debugLog(`Transcript: ${message.role}`, 'info', { text: message.transcript });
                    addMessage(message.role, message.transcript);
                }
            });
            
            // Throttle volume-level updates to reduce DOM operations
            let lastVolumeUpdate = 0;
            vapi.on('volume-level', (level) => {
                const now = Date.now();
                if (now - lastVolumeUpdate < 100) return; // Max 10 updates/sec
                lastVolumeUpdate = now;
                
                if (level > 0.1 && !avatar.classList.contains('listening')) {
                    avatar.classList.add('listening');
                    avatar.classList.remove('speaking');
                }
            });
            
            vapi.on('error', (error) => {
                const errorDetails = extractErrorDetails(error);
                debugLog('VAPI ERROR', 'error', errorDetails);
                let userMessage = errorDetails.message;
                if (errorDetails.code) userMessage += ` (Code: ${errorDetails.code})`;
                if (errorDetails.status) userMessage += ` [Status: ${errorDetails.status}]`;
                showError(userMessage || 'An unknown error occurred - check debug logs');
                callActive = false;
                updateUI('idle');
                stopTimer();
            });
            
        } catch (err) {
            debugLog('Failed to load VAPI SDK', 'error', extractErrorDetails(err));
            showError('Failed to load VAPI SDK: ' + (err.message || 'Unknown error'));
        }
        
        window.startCall = async function() {
            if (!vapi) {
                debugLog('VAPI not initialized', 'error');
                showError('VAPI not initialized');
                return;
            }

            try {
                // Step 1: Log environment info
                debugLog('=== STARTING CALL ===', 'info');
                debugLog('Environment', 'info', { assistantId: ASSISTANT_ID, online: navigator.onLine });
                
                if (!navigator.onLine) {
                    debugLog('No internet connection', 'error');
                    showError('No internet connection');
                    return;
                }
                
                updateUI('connecting');
                hideError();
                clearTranscript();

                // Step 2: Microphone
                debugLog('Step 1/3: Requesting microphone...', 'info');
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    debugLog('Microphone granted', 'info', { 
                        tracks: stream.getAudioTracks().map(t => ({ label: t.label, readyState: t.readyState }))
                    });
                } catch (micError) {
                    const errorDetails = extractErrorDetails(micError);
                    debugLog('Microphone failed', 'error', { ...errorDetails, errorName: micError.name });
                    
                    let micMessage = micError.name === 'NotAllowedError' ? 'Microphone access denied' :
                                     micError.name === 'NotFoundError' ? 'No microphone found' :
                                     micError.name === 'NotReadableError' ? 'Microphone in use' :
                                     'Microphone error: ' + micError.message;
                    showError(micMessage);
                    updateUI('idle');
                    return;
                }

                // Step 3: Start VAPI with timeout
                debugLog('Step 2/3: Initiating VAPI connection...', 'info');
                const startTime = Date.now();
                
                try {
                    const timeoutPromise = new Promise((_, reject) => 
                        setTimeout(() => reject(new Error('Connection timeout (30s)')), 30000)
                    );
                    
                    const result = await Promise.race([vapi.start(ASSISTANT_ID), timeoutPromise]);
                    debugLog('Step 3/3: Call initiated', 'info', { duration: (Date.now() - startTime) + 'ms' });
                    
                } catch (vapiError) {
                    const errorDetails = extractErrorDetails(vapiError);
                    debugLog('VAPI start() failed', 'error', { 
                        ...errorDetails, 
                        duration: (Date.now() - startTime) + 'ms',
                        stack: vapiError.stack?.substring(0, 300) 
                    });
                    
                    let userMessage = vapiError.message?.includes('timeout') ? 'Connection timeout' :
                                      vapiError.message?.includes('401') ? 'Auth failed - check API key' :
                                      vapiError.message?.includes('403') ? 'Access denied' :
                                      vapiError.message?.includes('404') ? 'Assistant not found' :
                                      vapiError.message?.includes('429') ? 'Rate limit exceeded' :
                                      vapiError.message?.includes('500') ? 'Server error' :
                                      'Call failed: ' + (errorDetails.message || 'Unknown error');
                    
                    showError(userMessage);
                    updateUI('idle');
                    if (stream) stream.getTracks().forEach(t => t.stop());
                }
                
            } catch (error) {
                const errorDetails = extractErrorDetails(error);
                debugLog('Unexpected error', 'error', { ...errorDetails, stack: error.stack?.substring(0, 300) });
                showError('Error: ' + (errorDetails.message || 'Unknown'));
                updateUI('idle');
            }
        };
        
        window.endCall = function() {
            if (vapi && callActive) {
                vapi.stop();
            }
        };
        
        window.toggleMute = function() {
            if (!vapi || !callActive) return;
            
            isMuted = !isMuted;
            vapi.setMuted(isMuted);
            muteBtn.textContent = isMuted ? '🔇' : '🎤';
            muteBtn.classList.toggle('muted', isMuted);
        };
        
        function updateUI(state) {
            status.className = 'status status-' + state;
            
            switch(state) {
                case 'idle':
                    status.textContent = '● Ready';
                    callBtn.style.display = 'flex';
                    hangupBtn.style.display = 'none';
                    muteBtn.disabled = true;
                    timer.classList.remove('visible');
                    avatar.classList.remove('speaking', 'listening');
                    break;
                case 'connecting':
                    status.textContent = '● Connecting...';
                    callBtn.style.display = 'none';
                    hangupBtn.style.display = 'flex';
                    muteBtn.disabled = true;
                    break;
                case 'active':
                    status.textContent = '● Active';
                    callBtn.style.display = 'none';
                    hangupBtn.style.display = 'flex';
                    muteBtn.disabled = false;
                    timer.classList.add('visible');
                    break;
                case 'ended':
                    status.textContent = '● Ended';
                    callBtn.style.display = 'flex';
                    hangupBtn.style.display = 'none';
                    muteBtn.disabled = true;
                    timer.classList.add('visible');
                    avatar.classList.remove('speaking', 'listening');
                    break;
            }
        }
        
        function startTimer() {
            callStartTime = new Date();
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((new Date() - callStartTime) / 1000);
                const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const seconds = (elapsed % 60).toString().padStart(2, '0');
                timer.textContent = minutes + ':' + seconds;
            }, 1000);
        }
        
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }
        
        function showError(message) {
            errorDiv.textContent = '⚠️ ' + message;
            errorDiv.classList.add('visible');
        }
        
        function hideError() {
            errorDiv.classList.remove('visible');
        }
    </script>
</body>
</html>
